
name: Build FNF Unified Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la
          test -f project.xml || { echo "ERROR: project.xml missing from repository root"; exit 1; }
          test -f source/Main.hx || { echo "ERROR: source/Main.hx missing"; exit 1; }
          echo "Project files found."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko
          haxe --version
          haxelib setup "$HOME/haxelib"

      - name: Install Lime and OpenFL
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib run lime setup -y

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Android target
        run: |
          haxelib run lime setup android

      - name: Build Android APK
        run: |
          haxelib run lime build project.xml android -release

      - name: Find APK
        if: success()
        run: |
          find . -type f -name "*.apk" -not -path "./.git/*"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Unified-APK
          path: |
            export/**/*.apk
            bin/**/*.apk
          if-no-files-found: error
          
