name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if haxelib install lime --quiet && haxelib install openfl --quiet; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Could not install Lime/OpenFL after 5 attempts"
              exit 1
            fi
            echo "Haxelib server may be busy; retrying in 15 seconds..."
            sleep 15
          done
          haxelib run lime setup -y

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;21.4.7075529'

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          haxelib run lime setup android

      - name: Show Lime project configuration
        run: haxelib run lime display project.xml android

      - name: Build release APK
        run: haxelib run lime build project.xml android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Unified-APK
          path: |
            export/**/*.apk
            bin/**/*.apk
          if-no-files-found: error
