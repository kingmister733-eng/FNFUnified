
name: Build FNF Unified Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          ls -la
          echo "Project XML:"
          cat project.xml
          test -f project.xml
          test -f source/Main.hx

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko
          haxe --version
          haxelib setup "$HOME/haxelib"

      - name: Install Lime and OpenFL
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib run lime setup -y

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configure Android target
        run: |
          haxelib run lime setup android

      - name: Build APK
        run: |
          haxelib run lime build ./project.xml android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Unified-APK
          path: |
            export/**/*.apk
            bin/**/*.apk
          if-no-files-found: error
          
