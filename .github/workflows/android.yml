name: Build FNF Unified Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK: ${{ env.ANDROID_HOME }}
      JAVA_HOME: ${{ env.JAVA_HOME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          pwd
          ls -la
          find source -maxdepth 3 -type f
          test -f project.xml
          test -f source/Main.hx

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko
          haxe --version
          haxelib setup "$HOME/haxelib"

      - name: Install Lime and OpenFL
        run: |
          set -e

          retry_install() {
            library="$1"
            for attempt in 1 2 3 4 5; do
              echo "Installing ${library}, attempt ${attempt}/5"
              if haxelib install "$library" --quiet; then
                return 0
              fi
              sleep 15
            done
            return 1
          }

          retry_install lime
          retry_install openfl
          haxelib run lime setup -y

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;21.4.7075529'

      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"

          if [ ! -d "$ANDROID_SDK" ]; then
            echo "Android SDK directory not found: $ANDROID_SDK"
            exit 1
          fi

          if [ ! -d "$ANDROID_NDK_ROOT" ]; then
            echo "Android NDK directory not found: $ANDROID_NDK_ROOT"
            exit 1
          fi

          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

          haxelib run lime setup android

      - name: Diagnose and Build Android APK
        working-directory: ${{ github.workspace }}
        run: |
          set -eux

          echo "Android SDK: $ANDROID_SDK"
          echo "Android NDK: $ANDROID_NDK_ROOT"
          echo "Java: $JAVA_HOME"

          test -f project.xml
          test -f source/Main.hx

          haxelib run lime display project.xml android
          haxelib run lime build project.xml android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Unified-APK
          path: |
            export/**/*.apk
            bin/**/*.apk
          if-no-files-found: error
