
name: Build FNF Unified Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        working-directory: ${{ github.workspace }}
        run: |
          echo "Repository directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Source files:"
          find source -maxdepth 3 -type f
          echo "Checking required files..."
          test -f project.xml
          test -f source/Main.hx
          echo "Required files found."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko
          haxe --version
          haxelib setup "$HOME/haxelib"

      - name: Install Lime and OpenFL
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib run lime setup -y

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build Android APK
        working-directory: ${{ github.workspace }}
        run: |
          echo "Project directory:"
          pwd
          echo "Checking project.xml:"
          test -f project.xml
          echo "Project XML:"
          head -n 20 project.xml
          echo "Lime version:"
          haxelib run lime --version
          echo "Starting Android build:"
          haxelib run lime build android -release -verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Unified-APK
          path: |
            export/**/*.apk
            bin/**/*.apk
          if-no-files-found: error
